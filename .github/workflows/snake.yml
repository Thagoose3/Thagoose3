name: Goose snake

# Draws the contribution graph being eaten, in the portfolio colours,
# and publishes the SVGs to the `output` branch used by README.md.
on:
  schedule:
    - cron: "17 0 * * *" # daily, 07:17 Bangkok
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/goose-snake.svg?color_snake=#ff6a1a&color_dots=#ebedf0,#ffd9c2,#ffa66b,#ff6a1a,#c2410c
            dist/goose-snake-dark.svg?palette=github-dark&color_snake=#ff6a1a&color_dots=#161b22,#0e4d5c,#138ba3,#2fc4e0,#5ee6ff
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update goose snake [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
