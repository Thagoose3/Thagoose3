<svg xmlns="http://www.w3.org/2000/svg" width="580" height="250" viewBox="0 0 580 250" role="img" aria-label="GooseFocus: Focus timer where your goose farm grows with every hour">
<defs>
  <radialGradient id="g" cx=".82" cy=".25" r=".75"><stop offset="0" stop-color="#ff6a1a" stop-opacity=".55"/><stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/></radialGradient>
  <radialGradient id="g2" cx="0" cy="1.1" r=".7"><stop offset="0" stop-color="#5ee6ff" stop-opacity=".16"/><stop offset="1" stop-color="#5ee6ff" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6a1a" stop-opacity=".9"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#ff6a1a" stop-opacity=".5"/></linearGradient>
  <clipPath id="c"><rect width="580" height="250" rx="18"/></clipPath>
</defs>
<style>
  .glow { animation: br 5s ease-in-out infinite; transform-origin: 470px 70px; }
  @keyframes br { 50% { transform: scale(1.15); opacity: .7; } }
  .fl { animation: fl 4.5s ease-in-out infinite; }
  @keyframes fl { 50% { transform: translateY(-8px) rotate(-4deg); } }
  .fl { transform-box: fill-box; transform-origin: center; }
  .p { animation: tw 3s ease-in-out infinite alternate; }
  @keyframes tw { to { opacity: .1; } }
  .ring { animation: spin 18s linear infinite; transform-origin: 470px 100px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
