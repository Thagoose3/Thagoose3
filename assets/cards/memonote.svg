  .p { animation: tw 3s ease-in-out infinite alternate; }
  @keyframes tw { to { opacity: .1; } }
  .ring { animation: spin 18s linear infinite; transform-origin: 470px 100px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
